<div class="form-page">
  <div class="form-container">
    <h2>{{ isEditMode ? 'Editar Produto' : 'Novo Produto' }}</h2>

    <form (ngSubmit)="onSubmit()" #form="ngForm">
      <div class="field">
        <label for="name">Nome</label>
        <input id="name" type="text" name="name" [(ngModel)]="formData.name" required />
      </div>

      <div class="field">
        <label for="description">Descrição</label>
        <textarea id="description" name="description" [(ngModel)]="formData.description" required rows="3"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Categorias</label>
          <app-tag-select
            [options]="categories"
            [selectedIds]="formData.categoryIds"
            (selectedIdsChange)="formData.categoryIds = $event"
            placeholder="Buscar categoria..."
          ></app-tag-select>
        </div>
        <div class="field">
          <label for="price">Preço (R$)</label>
          <input id="price" type="number" name="price" [(ngModel)]="formData.price" required min="0" step="0.01" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="rating">Avaliação</label>
          <input id="rating" type="number" name="rating" [(ngModel)]="formData.rating" required min="0" max="5" step="0.1" />
        </div>

        <div class="field">
          <label for="imageUrl">URL da Imagem</label>
          <input id="imageUrl" type="text" name="imageUrl" [(ngModel)]="formData.imageUrl" required />
        </div>
      </div>

      <div class="field-checkboxes">
        <label class="checkbox-label">
          <input type="checkbox" name="available" [(ngModel)]="formData.available" />
          Disponível
        </label>
      </div>

      <div class="sizes-section">
        <div class="sizes-header">
          <h4>Tamanhos (opcional)</h4>
          <button type="button" class="add-size-btn" (click)="addSize()">+ Adicionar tamanho</button>
        </div>

        @for (size of formData.sizes; track $index) {
          <div class="size-row">
            <input
              type="text"
              placeholder="Nome (ex: Individual)"
              [(ngModel)]="size.label"
              [name]="'sizeLabel' + $index"
            />
            <input
              type="number"
              placeholder="Acréscimo (R$)"
              [(ngModel)]="size.priceModifier"
              [name]="'sizePrice' + $index"
              step="0.01"
            />
            <button type="button" class="remove-size-btn" (click)="removeSize($index)">✕</button>
          </div>
        }
      </div>

      <div class="form-actions">
        <button type="button" class="cancel-btn" (click)="cancel()">Cancelar</button>
        <button type="submit" class="submit-btn" [disabled]="form.invalid">
          {{ isEditMode ? 'Salvar Alterações' : 'Criar Produto' }}
        </button>
      </div>
    </form>
  </div>
</div>
