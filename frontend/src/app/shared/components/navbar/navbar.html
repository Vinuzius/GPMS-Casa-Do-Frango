<header class="topbar" #topbarEl>
  <div class="logo">
    <a routerLink="/dashboard">
      <img src="assets/logo.png" alt="" class="logo-image" />
      <span>Casa do Frango</span>
    </a>
  </div>

  <nav class="nav-links">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Início
    </a>

    <a routerLink="/cardapio" routerLinkActive="active">
      Cardápio
    </a>

    <a routerLink="/pedidos" routerLinkActive="active">
      Pedidos
    </a>
  </nav>

  <div class="search-bar">
    <span>🔍</span>
    <input
      type="text"
      placeholder="O que deseja pedir?"
      #searchInput
      (keyup.enter)="search(searchInput.value)"
    />
  </div>
  <div class="actions">
    <button class="icon-btn" type="button" [routerLink]="['/notificacoes']" aria-label="Notificações">
      🔔
      @if (unreadNotificationCount() > 0) {
        <span class="badge">{{ unreadNotificationCount() }}</span>
      }
    </button>

    <div class="profile-menu">
      <button
        class="icon-btn profile-trigger"
        type="button"
        aria-label="Menu do perfil"
        (click)="toggleProfileMenu($event)"
      >
        {{ perfilService.perfil()?.nome ?? authService.user()?.email ?? '👤' }}
      </button>

      @if (isProfileMenuOpen) {
        <div class="dropdown">
          <a [routerLink]="['/perfil']" [queryParams]="{ secao: 'dados' }" (click)="closeProfileMenu()">Dados cadastrais</a>
          <a routerLink="/historico-pedidos" (click)="closeProfileMenu()">Histórico de Pedidos</a>
          <a [routerLink]="['/perfil']" [queryParams]="{ secao: 'enderecos' }" (click)="closeProfileMenu()">Endereços</a>
          @if (perfilService.perfil()?.is_admin) {
            <a routerLink="/admin" (click)="closeProfileMenu()">Painel Admin</a>
          }
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-sair" (click)="sair()">Sair</button>
        </div>
      }
    </div>

    <button class="cart-btn" type="button" [routerLink]="['/carrinho']" aria-label="Carrinho">
      🛒
      @if (cartItemCount() > 0) {
        <span class="badge">{{ cartItemCount() }}</span>
      }
    </button>
  </div>
</header>
