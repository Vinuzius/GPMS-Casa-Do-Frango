<header class="topbar">
  <div class="logo">
    <span>Casa do Frango</span>
  </div>

  <nav class="nav-links">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >Início</a>

    <a routerLink="/produtos" routerLinkActive="active">Pedidos</a>

    <a routerLink="/notificacoes">Avisos</a>

    <a routerLink="/perfil">Perfil
    </a>
  </nav>

  <div class="search-cart">
    <div class="search-bar">
      <input type="text" placeholder="O que deseja pedir?" />
      <span>⚲</span>
    </div>

    <button class="cart-btn" type="button" routerLink="/carrinho">
      🛒 <span class="badge">1</span>
    </button>
  </div>
</header>
